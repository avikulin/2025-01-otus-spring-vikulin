spring:
  datasource:
    url: jdbc:h2:file:./db-temp/maindb;AUTO_SERVER=TRUE

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: validate

    generate-ddl: true
    show-sql: false

    properties:
      hibernate:
        format_sql: true
        default_schema: OTUS_HW_07
        type: TRACE
        use_sql_comments: true
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        show_sql: false

  sql:
    init:
      mode: always

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    template-resolver-order: 1
    check-template-location: true

  mvc:
    static-path-pattern: /**

  web:
    resources:
      static-locations: classpath:/static/

