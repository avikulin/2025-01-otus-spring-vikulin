<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="otus-breadcrumb-area" class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid">
            <button class="btn btn-secondary" id="sidebarToggle">☰</button>
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!--/*@thymesVar id="navigation_state" type="ru.otus.hw.dto.navigation.NavigationStateDto"*/-->
            <div class="collapse navbar-collapse" id="navbarSupportedContent" th:object="${navigation_state}">
                <ul id="breadcrumb-path" class="navbar-nav mt-2 mt-lg-0" th:each="topNavItem, iter: *{getBreadCrumbState()}">
                    <li id="top-menu-item" class="nav-item">
                        <a class="nav-link" th:href="@{${topNavItem.getUrl()}}">
                            <span th:text="${topNavItem.getTitle()}">breadcrumb menu item</span>
                        </a>
                    </li>
                    <li id="tom-menu-termination-marker" class="nav-item">
                        <span class="nav-link" th:text="${iter.last} ? '' : '/'"></span>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                    <li class="nav-item active"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           id="navbarDropdown"
                           href="#" role="button" data-bs-toggle="dropdown"
                           aria-haspopup="true" aria-expanded="false">About</a>
                        <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <a class="dropdown-item" href="#!">Application</a>
                            <a class="dropdown-item" href="https://otus.ru/">OTUS</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="https://docs.spring.io/spring-framework/reference/web/webmvc.html">Spring Boot Web MVC</a>
                        </div>
                    </li>
                    <li class="nav-item">
                        <div class="nav-link tg-share-link">
                            <script async src="https://telegram.org/js/telegram-widget.js?22"
                                    data-telegram-share-url="https://otus.ru/lessons/javaspring/"
                                    data-comment="share link"></script>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
