<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <th:block th:fragment="dialog(contentFragment)">
        <th:block th:replace="~{fragments/otus-header :: otus-header('Dialog's content')}"></th:block>
        <body>
        <div class="d-flex" id="wrapper">

            <!-- Page content wrapper-->
            <div id="page-content-wrapper">

                <!-- Page content-->
                <div class="container-fluid">

                    <!-- Main content section (required) -->
                    <main th:replace="${contentFragment}"></main>
                </div>
            </div>
        </div>
        <th:block th:replace="~{fragments/otus-footer :: otus-footer}"></th:block>
        </body>
    </th:block>
</html>
